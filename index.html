<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CYBER//2077</title>

  <style>
    :root {
      --bg: #03030a;
      --panel: #0a0a18;

      --cyan: #00f7ff;
      --pink: #ff00a8;
      --purple: #9d00ff;
      --green: #39ff88;

      --white: #f4ffff;
      --muted: #7d8ba3;

      --cyan-glow:
        0 0 5px #00f7ff,
        0 0 20px rgba(0,247,255,.6);

      --pink-glow:
        0 0 5px #ff00a8,
        0 0 20px rgba(255,0,168,.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      font-family:
        "Courier New",
        Courier,
        monospace;

      color: var(--white);

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(157,0,255,.18),
          transparent 30%
        ),
        radial-gradient(
          circle at 80% 70%,
          rgba(0,247,255,.12),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #03030a,
          #080313,
          #03030a
        );

      overflow-x: hidden;
    }

    /* SCANLINES */

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      z-index: 9999;

      background:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,.018) 0px,
          rgba(255,255,255,.018) 1px,
          transparent 1px,
          transparent 4px
        );
    }

    /* GRID */

    body::after {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      z-index: 0;

      background-image:
        linear-gradient(
          rgba(0,247,255,.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(0,247,255,.035) 1px,
          transparent 1px
        );

      background-size: 50px 50px;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent
        );
    }

    /* NEON ORBS */

    .orb {
      position: fixed;

      width: 350px;
      height: 350px;

      border-radius: 50%;

      filter: blur(120px);

      opacity: .12;

      pointer-events: none;

      z-index: 1;
    }

    .orb-purple {
      background: var(--purple);

      left: -150px;
      top: 15%;

      animation:
        floatOrb 8s ease-in-out infinite;
    }

    .orb-cyan {
      background: var(--cyan);

      right: -150px;
      bottom: 10%;

      animation:
        floatOrb 10s ease-in-out infinite reverse;
    }

    @keyframes floatOrb {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-70px);
      }
    }

    /* RAIN */

    .rain {
      position: fixed;

      inset: 0;

      pointer-events: none;

      overflow: hidden;

      z-index: 2;
    }

    .rain span {
      position: absolute;

      top: -100px;

      width: 1px;

      height: 60px;

      background:
        linear-gradient(
          transparent,
          var(--cyan)
        );

      opacity: .35;

      animation:
        rainFall linear infinite;
    }

    @keyframes rainFall {
      to {
        transform:
          translateY(120vh);
      }
    }

    /* CONTAINER */

    .container {
      width:
        min(
          1100px,
          calc(100% - 40px)
        );

      margin: auto;

      position: relative;

      z-index: 5;
    }

    /* NAVIGATION */

    nav {
      position: fixed;

      top: 0;

      width: 100%;

      padding: 20px 0;

      background:
        rgba(3,3,10,.78);

      backdrop-filter:
        blur(15px);

      border-bottom:
        1px solid rgba(0,247,255,.2);

      z-index: 1000;
    }

    .nav-inner {
      display: flex;

      justify-content:
        space-between;

      align-items: center;
    }

    .logo {
      color: var(--cyan);

      font-weight: 900;

      font-family:
        Arial,
        sans-serif;

      letter-spacing: 2px;

      text-shadow:
        0 0 10px var(--cyan);
    }

    .logo span {
      color: var(--pink);

      text-shadow:
        0 0 10px var(--pink);
    }

    .nav-links {
      display: flex;

      gap: 25px;

      list-style: none;
    }

    .nav-links a {
      color: var(--muted);

      text-decoration: none;

      font-size: .75rem;

      transition: .25s;
    }

    .nav-links a:hover {
      color: var(--cyan);

      text-shadow:
        0 0 10px var(--cyan);
    }

    /* HERO */

    header {
      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      position: relative;
    }

    .hero {
      padding-top: 80px;
    }

    .status {
      display: inline-flex;

      align-items: center;

      gap: 9px;

      padding: 9px 17px;

      color: var(--green);

      border:
        1px solid var(--green);

      font-size: .7rem;

      box-shadow:
        0 0 20px rgba(57,255,136,.15);

      margin-bottom: 30px;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--green);

      box-shadow:
        0 0 10px var(--green);

      animation:
        blink 1s infinite;
    }

    @keyframes blink {
      50% {
        opacity: .2;
      }
    }

    .subtitle {
      color: var(--pink);

      font-size: .65rem;

      letter-spacing: 5px;

      margin-bottom: 20px;

      text-shadow:
        0 0 10px var(--pink);
    }

    h1 {
      font-family:
        Arial,
        sans-serif;

      font-size:
        clamp(
          3rem,
          11vw,
          7rem
        );

      line-height: 1;

      letter-spacing: -4px;

      margin-bottom: 30px;

      color: white;

      text-shadow:
        0 0 5px white,
        0 0 20px var(--cyan),
        0 0 45px var(--cyan);
    }

    /* GLITCH */

    .glitch {
      position: relative;

      display: inline-block;
    }

    .glitch::before,
    .glitch::after {
      content: attr(data-text);

      position: absolute;

      inset: 0;
    }

    .glitch::before {
      color: var(--pink);

      clip-path:
        polygon(
          0 0,
          100% 0,
          100% 35%,
          0 35%
        );

      transform:
        translate(3px);

      animation:
        glitch 2s infinite;
    }

    .glitch::after {
      color: var(--cyan);

      clip-path:
        polygon(
          0 65%,
          100% 65%,
          100% 100%,
          0 100%
        );

      transform:
        translate(-3px);

      animation:
        glitch 1.7s infinite;
    }

    @keyframes glitch {
      0%, 90%, 100% {
        transform:
          translate(0);
      }

      92% {
        transform:
          translate(8px, -3px);
      }

      94% {
        transform:
          translate(-8px, 3px);
      }
    }

    /* HERO TEXT */

    .hero-description {
      max-width: 700px;

      margin: auto;

      color: var(--muted);

      font-size: 1rem;

      line-height: 1.8;
    }

    .hero-description span {
      color: var(--cyan);

      text-shadow:
        0 0 8px var(--cyan);
    }

    /* BUTTONS */

    .buttons {
      display: flex;

      justify-content: center;

      gap: 15px;

      flex-wrap: wrap;

      margin-top: 40px;
    }

    .button {
      display: inline-block;

      padding: 15px 25px;

      text-decoration: none;

      font-weight: bold;

      font-size: .7rem;

      transition: .3s;

      clip-path:
        polygon(
          8px 0,
          100% 0,
          100% calc(100% - 8px),
          calc(100% - 8px) 100%,
          0 100%,
          0 8px
        );
    }

    .primary {
      background: var(--cyan);

      color: #020207;

      box-shadow:
        0 0 25px rgba(0,247,255,.45);
    }

    .secondary {
      color: var(--pink);

      border:
        1px solid var(--pink);

      background:
        rgba(255,0,168,.04);
    }

    .button:hover {
      transform:
        translateY(-5px)
        scale(1.03);

      filter:
        brightness(1.25);
    }

    .primary:hover {
      box-shadow:
        0 0 15px var(--cyan),
        0 0 45px rgba(0,247,255,.5);
    }

    .secondary:hover {
      box-shadow:
        0 0 20px var(--pink),
        inset 0 0 20px rgba(255,0,168,.15);
    }

    /* SCROLL INDICATOR */

    .scroll {
      position: absolute;

      bottom: 30px;

      left: 50%;

      transform:
        translateX(-50%);

      color: var(--muted);

      font-size: .55rem;

      letter-spacing: 4px;
    }

    .scroll div {
      color: var(--cyan);

      font-size: 1.2rem;

      margin-top: 8px;

      animation:
        scrollMove 1.5s infinite;
    }

    @keyframes scrollMove {
      50% {
        transform:
          translateY(8px);
      }
    }

    /* SECTIONS */

    section {
      padding: 120px 0;
    }

    .section-title {
      color: var(--cyan);

      font-family:
        Arial,
        sans-serif;

      font-size: 1.8rem;

      margin-bottom: 45px;

      text-shadow:
        0 0 15px rgba(0,247,255,.5);
    }

    .section-title::before {
      content: "// ";

      color: var(--pink);
    }

    /* PROJECT GRID */

    .projects {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(270px, 1fr)
        );

      gap: 25px;
    }

    /* PROJECT CARD */

    .project {
      position: relative;

      padding: 30px;

      min-height: 300px;

      background:
        linear-gradient(
          145deg,
          rgba(10,10,25,.92),
          rgba(25,8,38,.82)
        );

      border:
        1px solid rgba(0,247,255,.25);

      overflow: hidden;

      transition:
        .4s;

      backdrop-filter:
        blur(10px);
    }

    .project::before {
      content:
        "SYSTEM//PROJECT";

      position: absolute;

      top: 12px;

      right: 15px;

      color:
        rgba(0,247,255,.25);

      font-size: .5rem;
    }

    .project::after {
      content: "";

      position: absolute;

      width: 150px;
      height: 150px;

      left: -80px;
      top: -80px;

      background:
        var(--pink);

      filter:
        blur(70px);

      opacity: 0;

      transition: .4s;
    }

    .project:hover {
      transform:
        translateY(-10px);

      border-color:
        var(--pink);

      box-shadow:
        0 0 25px rgba(255,0,168,.18),
        inset 0 0 30px rgba(0,247,255,.04);
    }

    .project:hover::after {
      opacity: .25;
    }

    .project-number {
      color: var(--pink);

      font-size: .65rem;

      margin-bottom: 20px;
    }

    .project h3 {
      color: white;

      font-family:
        Arial,
        sans-serif;

      font-size: 1.25rem;

      margin-bottom: 15px;

      text-shadow:
        0 0 10px rgba(255,255,255,.2);
    }

    .project p {
      color: var(--muted);

      line-height: 1.7;

      font-size: .85rem;

      margin-bottom: 25px;
    }

    .project-link {
      color: var(--cyan);

      text-decoration: none;

      font-size: .7rem;

      transition: .2s;
    }

    .project-link:hover {
      text-shadow:
        0 0 12px var(--cyan);
    }

    /* PROJECT ICONS */

    .project-icon {
      width: 65px;
      height: 65px;

      display: flex;

      align-items: center;
      justify-content: center;

      margin-bottom: 25px;

      border:
        1px solid var(--cyan);

      color: var(--cyan);

      font-family:
        Arial,
        sans-serif;

      font-size: 1.7rem;

      box-shadow:
        0 0 15px rgba(0,247,255,.12);

      transition: .3s;
    }

    .project:hover .project-icon {
      color: var(--pink);

      border-color:
        var(--pink);

      box-shadow:
        0 0 20px rgba(255,0,168,.3);

      transform:
        rotate(5deg)
        scale(1.08);
    }

    /* TERMINAL */

    .terminal {
      position: relative;

      background:
        rgba(2,3,8,.9);

      border:
        1px solid rgba(57,255,136,.35);

      padding: 30px;

      box-shadow:
        0 0 30px rgba(57,255,136,.07);

      overflow: hidden;
    }

    .terminal::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;
      right: 0;

      height: 3px;

      background:
        linear-gradient(
          90deg,
          var(--green),
          var(--cyan),
          transparent
        );

      box-shadow:
        0 0 15px var(--green);
    }

    .terminal-header {
      color: var(--muted);

      border-bottom:
        1px solid rgba(57,255,136,.12);

      padding-bottom: 15px;

      margin-bottom: 20px;
    }

    .terminal p {
      color: var(--green);

      line-height: 2;

      font-size: .85rem;
    }

    .command {
      color: var(--cyan);

      text-shadow:
        0 0 8px var(--cyan);
    }

    .cursor {
      animation:
        cursorBlink .7s infinite;
    }

    @keyframes cursorBlink {
      50% {
        opacity: 0;
      }
    }

    /* CONTACT */

    .contact {
      position: relative;

      text-align: center;

      padding: 80px 25px;

      border:
        1px solid rgba(255,0,168,.35);

      background:
        rgba(255,0,168,.035);

      overflow: hidden;

      box-shadow:
        inset 0 0 50px rgba(255,0,168,.03);
    }

    .contact::before {
      content:
        "SECURE_CHANNEL";

      position: absolute;

      top: 15px;
      left: 20px;

      color:
        rgba(255,0,168,.3);

      font-size: .5rem;
    }

    .contact h2 {
      color: var(--pink);

      font-family:
        Arial,
        sans-serif;

      font-size:
        clamp(
          1.3rem,
          4vw,
          2rem
        );

      margin-bottom: 18px;

      text-shadow:
        0 0 20px rgba(255,0,168,.5);
    }

    .contact p {
      color: var(--muted);

      margin-bottom: 10px;
    }

    .email {
      display: inline-block;

      margin-top: 20px;

      padding: 15px 25px;

      color: var(--cyan);

      border:
        1px solid var(--cyan);

      text-decoration: none;

      transition: .3s;

      box-shadow:
        0 0 15px rgba(0,247,255,.12);
    }

    .email:hover {
      background: var(--cyan);

      color: #020207;

      box-shadow:
        0 0 35px rgba(0,247,255,.55);

      transform:
        scale(1.05);
    }

    /* FOOTER */

    footer {
      text-align: center;

      padding: 45px 0;

      color: #4b566c;

      font-size: .65rem;
    }

    footer span {
      color: var(--cyan);
    }

    /* REVEAL ANIMATION */

    .reveal {
      opacity: 0;

      transform:
        translateY(35px);

      transition:
        opacity .8s ease,
        transform .8s ease;
    }

    .reveal.visible {
      opacity: 1;

      transform:
        translateY(0);
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .container {
        width:
          calc(100% - 26px);
      }

      nav {
        padding: 14px 0;
      }

      .nav-inner {
        flex-direction: column;

        gap: 12px;
      }

      .nav-links {
        gap: 12px;
      }

      .nav-links a {
        font-size: .55rem;
      }

      header {
        padding-top: 120px;
      }

      h1 {
        font-size:
          clamp(
            2.8rem,
            16vw,
            5rem
          );

        letter-spacing: -2px;
      }

      .hero-description {
        font-size: .85rem;
      }

      .subtitle {
        font-size: .55rem;

        letter-spacing: 3px;
      }

      section {
        padding: 90px 0;
      }

      .section-title {
        font-size: 1.4rem;
      }

      .terminal {
        padding: 20px;
      }

      .terminal p {
        font-size: .72rem;
      }

      .scroll {
        display: none;
      }
    }
